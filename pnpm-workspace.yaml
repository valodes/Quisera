  - '@better-auth/drizzle-adapter@1.7.23'
  - '@better-auth/kysely-adapter@1.7.23'
  - '@better-auth/memory-adapter@1.7.23'
  - '@better-auth/mongo-adapter@1.7.23'
  - '@better-auth/prisma-adapter@1.7.23'
  - '@better-auth/telemetry@1.7.23'
  - better-auth@1.7.23
  - auth@1.7.23
